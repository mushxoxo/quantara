name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - ghp # or main
  workflow_dispatch: # Allows you to manually trigger the workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: './B2B Dashboard Design'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './B2B Dashboard Design/package-lock.json'
          
      - name: Install dependencies
        run: npm ci

      - name: Create Env File
        run: |
          touch .env
          echo GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} >> .env
          echo GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} >> .env
          echo OPENROUTESERVICE_API_KEY=${{ secrets.OPENROUTESERVICE_API_KEY }} >> .env
          echo VITE_ORS_API_KEY=${{ secrets.VITE_ORS_API_KEY }} >> .env
          echo VITE_NEWS_API_KEY=${{ secrets.VITE_NEWS_API_KEY }} >> .env
          echo MONGO_URI=${{ secrets.MONGO_URI }} >> .env
          echo GH_KEY=${{ secrets.GH_KEY }} >> .env
          echo JWT_SECRET=${{ secrets.JWT_SECRET }} >> .env
          echo OLLAMA_MODEL=${{ secrets.OLLAMA_MODEL }} >> .env
          echo CHATBOT_URL=${{ secrets.CHATBOT_URL }} >> .env
          echo CHATBOT_PORT=${{ secrets.CHATBOT_PORT }} >> .env

      - name: Build
        run: npm run build
        
      - name: Handle Single Page App (SPA) Routing
        # Copies index.html to 404.html to resolve React Router refreshing issue on GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './B2B Dashboard Design/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
